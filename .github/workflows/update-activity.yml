name: ⚡ Sync GitHub Profile Stats & Activity

on:
  schedule:
    # Tự động cập nhật mỗi 6 tiếng một lần
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'assets/**'
      - 'profile-3d-contrib/**'

permissions:
  contents: write

jobs:
  update-profile-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚡ Fetch and Update Live GitHub Activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/update_activity.py

      - name: 🔥 Calculate & Update GitHub Streak Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/update_streak.py

      - name: 📈 Fetch and Update Most Used Languages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/update_langs.py

      - name: 🧠 Fetch and Update LeetCode Stats
        run: |
          python .github/scripts/update_leetcode.py

      - name: 🧊 Generate 3D Contribution City SVGs
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: 🔄 Bust GitHub Camo Image Cache in README
        run: |
          python .github/scripts/bust_cache.py

      - name: 🚀 Commit & Push All Updated Assets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/ profile-3d-contrib/ README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "⚡ chore(profile): sync 3D city, streak stats, LeetCode, languages & activity feed [skip ci]" && git push)
