name: Refresh profile

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/build_profile.py'
      - '.github/workflows/update-activity.yml'
      - 'assets/icons/**'

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh GitHub, selected private repo languages, and LeetCode data
        id: build
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python .github/scripts/build_profile.py --refresh
      - name: Update image cache keys
        run: python .github/scripts/bust_cache.py
      - name: Commit refreshed assets
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add assets/profile-*.svg assets/tech-stack.svg assets/project-*.svg assets/github-summary.svg assets/leetcode-summary.svg assets/languages-summary.svg assets/contact-*.svg assets/profile-data.json README.md
          if ! git diff --staged --quiet assets/*.svg README.md; then
            git commit -m "chore(profile): refresh projects and coding stats [skip ci]"
            git push
          fi
      - name: Report incomplete refresh
        if: steps.build.outcome == 'failure'
        run: |
          echo "One or more sources failed. Available updates were saved; previous data was preserved for failed sources."
          exit 1
