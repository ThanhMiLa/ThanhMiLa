name: 📈 Sync Most Used Languages

# on.schedule đã được tích hợp trong workflow chính 'update-activity.yml' (chạy mỗi 6 tiếng cho toàn bộ profile).
# Giữ workflow_dispatch và push để có thể chạy lẻ hoặc test khi chỉnh sửa script.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/update_langs.py'
      - '.github/workflows/update-langs.yml'

permissions:
  contents: write

jobs:
  sync-languages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📈 Fetch and Update Most Used Languages
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/update_langs.py

      - name: 🔄 Bust GitHub Camo Image Cache in README
        run: |
          python .github/scripts/bust_cache.py

      - name: 🚀 Commit & Push Most Used Languages Card
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/most-used-langs.svg README.md
          git diff --staged --quiet || (git commit -m "📈 chore(profile): sync most used languages stats [skip ci]" && git pull --rebase origin main && git push)
