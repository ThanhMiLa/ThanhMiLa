<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 960 300"
  width="100%"
  height="100%"
  preserveAspectRatio="xMidYMid meet"
>
  <defs>
    <!-- Modern Fonts and Animations in CDATA to guarantee valid XML -->
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Outfit:wght@800;900&display=swap');

      .main-title {
        font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 60px;
        letter-spacing: 7px;
        text-transform: uppercase;
      }
      .tagline {
        font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 3.5px;
      }
      .badge-text {
        font-family: 'Fira Code', monospace;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .code-sub {
        font-family: 'Fira Code', monospace;
        font-size: 12px;
        font-weight: 600;
      }

      /* Hardware Accelerated 2D Floating Animations */
      @keyframes floatJavaAnim {
        0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
        25% { transform: translate(14px, -18px) rotate(3deg); }
        50% { transform: translate(22px, -8px) rotate(0deg); }
        75% { transform: translate(8px, 12px) rotate(-3deg); }
      }
      @keyframes floatFptAnim {
        0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
        25% { transform: translate(-14px, 18px) rotate(-3deg); }
        50% { transform: translate(-22px, 8px) rotate(0deg); }
        75% { transform: translate(-8px, -12px) rotate(3deg); }
      }
      @keyframes floatBackendAnim {
        0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
        25% { transform: translate(16px, -16px) rotate(3deg); }
        50% { transform: translate(24px, -6px) rotate(0deg); }
        75% { transform: translate(8px, 14px) rotate(-3deg); }
      }
      @keyframes floatDevopsAnim {
        0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
        25% { transform: translate(-16px, -14px) rotate(-3deg); }
        50% { transform: translate(-24px, 4px) rotate(0deg); }
        75% { transform: translate(-8px, 16px) rotate(3deg); }
      }

      @keyframes floatLeftIcon {
        0%, 100% { transform: translate(0px, 0px); }
        25% { transform: translate(6px, -18px); }
        50% { transform: translate(12px, 0px); }
        75% { transform: translate(6px, 18px); }
      }
      @keyframes floatRightIcon {
        0%, 100% { transform: translate(0px, 0px); }
        25% { transform: translate(-6px, 18px); }
        50% { transform: translate(-12px, 0px); }
        75% { transform: translate(-6px, -18px); }
      }

      @keyframes twinkle {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }

      .float-java { animation: floatJavaAnim 4.2s ease-in-out infinite; }
      .float-fpt { animation: floatFptAnim 4.6s ease-in-out infinite; }
      .float-backend { animation: floatBackendAnim 4.8s ease-in-out infinite; }
      .float-devops { animation: floatDevopsAnim 4.4s ease-in-out infinite; }
      .float-icon-left { animation: floatLeftIcon 3.8s ease-in-out infinite; }
      .float-icon-right { animation: floatRightIcon 3.8s ease-in-out infinite; }

      .star-1 { animation: twinkle 3s ease-in-out infinite; transform-origin: 230px 55px; }
      .star-2 { animation: twinkle 4s ease-in-out infinite 1s; transform-origin: 720px 80px; }
      .star-3 { animation: twinkle 3.5s ease-in-out infinite 2s; transform-origin: 240px 240px; }
      .star-4 { animation: twinkle 4.5s ease-in-out infinite 1.5s; transform-origin: 690px 235px; }
    ]]></style>

    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12"/>
      <stop offset="50%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#080b14"/>
    </linearGradient>

    <!-- Vibrant Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="35%" stop-color="#4FACFE"/>
      <stop offset="70%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </linearGradient>

    <!-- Subtitle text gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7AA2F7"/>
      <stop offset="50%" stop-color="#BB9AF7"/>
      <stop offset="100%" stop-color="#7DCFFF"/>
    </linearGradient>

    <!-- Top Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(122, 162, 247, 0.15)"/>
      <stop offset="100%" stop-color="rgba(187, 154, 247, 0.15)"/>
    </linearGradient>

    <!-- Laser Snake Gradients -->
    <linearGradient id="snakeLaser1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#7000FF"/>
    </linearGradient>

    <linearGradient id="snakeLaser2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="50%" stop-color="#FF7700"/>
      <stop offset="100%" stop-color="#FFE600"/>
    </linearGradient>

    <!-- Ambient Orbs -->
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7000FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0"/>
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#7aa2f7" stroke-width="0.75" stroke-opacity="0.07"/>
      <circle cx="30" cy="30" r="1" fill="#7aa2f7" fill-opacity="0.18"/>
    </pattern>

    <!-- Clip Path -->
    <clipPath id="cardClip">
      <rect x="6" y="6" width="948" height="288" rx="14"/>
    </clipPath>
  </defs>

  <!-- ==================== BACKGROUND ==================== -->
  <rect width="960" height="300" rx="16" fill="url(#bgGrad)"/>

  <g clip-path="url(#cardClip)">
    <!-- Tech Grid -->
    <rect x="6" y="6" width="948" height="288" fill="url(#techGrid)"/>

    <!-- Ambient Background Lighting -->
    <circle cx="200" cy="90" r="160" fill="url(#orbCyan)"/>
    <circle cx="760" cy="190" r="180" fill="url(#orbPurple)"/>
    <circle cx="480" cy="150" r="150" fill="url(#orbGreen)"/>

    <!-- Scanline Accents -->
    <line x1="0" y1="50" x2="960" y2="50" stroke="#7aa2f7" stroke-opacity="0.08" stroke-dasharray="8 12"/>
    <line x1="0" y1="250" x2="960" y2="250" stroke="#7aa2f7" stroke-opacity="0.08" stroke-dasharray="8 12"/>

    <!-- ==================== FLOATING TECH BADGES ==================== -->

    <!-- [1] Top-Left: JAVA Badge -->
    <g transform="translate(65, 40)">
      <g class="float-java">
        <rect x="0" y="0" width="105" height="34" rx="17" fill="#141a29" stroke="#ED8B00" stroke-width="1.2" stroke-opacity="0.85"/>
        <text x="14" y="22" font-size="16">☕</text>
        <text x="38" y="22" fill="#FFA94D" class="badge-text">JAVA</text>
        <circle cx="88" cy="17" r="3" fill="#00FF88"/>
      </g>
    </g>

    <!-- [2] Top-Right: FPT Badge -->
    <g transform="translate(795, 40)">
      <g class="float-fpt">
        <rect x="0" y="0" width="100" height="34" rx="17" fill="#141a29" stroke="#F37021" stroke-width="1.2" stroke-opacity="0.85"/>
        <text x="14" y="22" font-size="16">🎓</text>
        <text x="40" y="22" fill="#FF922B" class="badge-text">FPT</text>
        <circle cx="84" cy="17" r="3" fill="#0084FF"/>
      </g>
    </g>

    <!-- [3] Bottom-Left: BACKEND Badge -->
    <g transform="translate(65, 225)">
      <g class="float-backend">
        <rect x="0" y="0" width="135" height="34" rx="17" fill="#141a29" stroke="#00F2FE" stroke-width="1.2" stroke-opacity="0.85"/>
        <text x="14" y="22" font-size="15">⚙️</text>
        <text x="36" y="22" fill="#00F2FE" class="badge-text">BACKEND</text>
        <circle cx="118" cy="17" r="3" fill="#00FF88"/>
      </g>
    </g>

    <!-- [4] Bottom-Right: DEVOPS Badge -->
    <g transform="translate(765, 225)">
      <g class="float-devops">
        <rect x="0" y="0" width="130" height="34" rx="17" fill="#141a29" stroke="#9d4edd" stroke-width="1.2" stroke-opacity="0.85"/>
        <text x="14" y="22" font-size="16">☁️</text>
        <text x="40" y="22" fill="#E599F7" class="badge-text">DEVOPS</text>
        <circle cx="114" cy="17" r="3" fill="#9d4edd"/>
      </g>
    </g>

    <!-- [5] Mid-Left: Code Brackets { } -->
    <g transform="translate(55, 150)">
      <g class="float-icon-left">
        <circle cx="0" cy="0" r="20" fill="#141b2d" stroke="#00F2FE" stroke-width="1.2" stroke-opacity="0.7"/>
        <text x="0" y="0" text-anchor="middle" dominant-baseline="central" fill="#00F2FE" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="700">{ }</text>
      </g>
    </g>

    <!-- [6] Mid-Right: Terminal Tag < / > -->
    <g transform="translate(905, 150)">
      <g class="float-icon-right">
        <circle cx="0" cy="0" r="20" fill="#141b2d" stroke="#7000FF" stroke-width="1.2" stroke-opacity="0.7"/>
        <text x="0" y="0" text-anchor="middle" dominant-baseline="central" fill="#BB9AF7" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700">&lt;/&gt;</text>
      </g>
    </g>

    <!-- Floating Sparkles and Twinkling Stars -->
    <g class="star-1">
      <path d="M 230,48 Q 230,55 237,55 Q 230,55 230,62 Q 230,55 223,55 Q 230,55 230,48" fill="#00F2FE"/>
    </g>
    <g class="star-2">
      <path d="M 720,74 Q 720,80 726,80 Q 720,80 720,86 Q 720,80 714,80 Q 720,80 720,74" fill="#00FF88"/>
    </g>
    <g class="star-3">
      <path d="M 240,234 Q 240,240 246,240 Q 240,240 240,246 Q 240,240 234,240 Q 240,240 240,234" fill="#FF007F"/>
    </g>
    <g class="star-4">
      <path d="M 690,228 Q 690,235 697,235 Q 690,235 690,242 Q 690,235 683,235 Q 690,235 690,228" fill="#FFE600"/>
    </g>

    <!-- Floating Binary Matrix Bits -->
    <text x="180" y="155" fill="#7aa2f7" fill-opacity="0.25" font-family="'Fira Code', monospace" font-size="12">10110</text>
    <text x="740" y="155" fill="#7aa2f7" fill-opacity="0.25" font-family="'Fira Code', monospace" font-size="12">01001</text>

    <!-- ==================== CENTER HERO: THANH MILA ==================== -->

    <!-- Ambient Aura Glow Behind Name -->
    <ellipse cx="480" cy="140" rx="270" ry="48" fill="#00F2FE" opacity="0.15"/>

    <!-- Top Status Indicator Pill: BACKEND DEVELOPER -->
    <g transform="translate(480, 42)">
      <rect x="-105" y="0" width="210" height="28" rx="14" fill="url(#pillGrad)" stroke="#7aa2f7" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="-86" cy="14" r="4.5" fill="#00FF88"/>
      <text x="-72" y="19" fill="#7DCFFF" class="code-sub" font-size="12" letter-spacing="1.5">BACKEND DEVELOPER</text>
    </g>

    <!-- MAIN NAME: THANH MILA -->
    <g transform="translate(480, 148)" text-anchor="middle">
      <!-- Subtle Shadow Backdrop -->
      <text x="2" y="2" class="main-title" fill="#000000" opacity="0.6">
        THANH MILA
      </text>
      <text x="0" y="0" class="main-title" fill="url(#titleGrad)">
        THANH MILA
      </text>
    </g>

    <!-- Tagline: Java and Spring Boot Ecosystem -->
    <g transform="translate(480, 198)" text-anchor="middle">
      <text x="0" y="0" class="tagline" fill="url(#subGrad)">
        JAVA &amp; SPRING BOOT ECOSYSTEM • SOFTWARE ENGINEERING
      </text>
    </g>
  </g>

  <!-- ==================== DUAL LASER RACING SNAKE BORDER ==================== -->
  <!-- Perimeter = 2 * (948 + 288) ≈ 2472 px -->

  <!-- Snake 1: Cyan-Green-Purple Clockwise Laser -->
  <rect x="6" y="6" width="948" height="288" rx="14"
        fill="none" stroke="url(#snakeLaser1)" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="320 2152" stroke-dashoffset="0"
        opacity="0.9">
    <animate attributeName="stroke-dashoffset" from="0" to="-2472" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Snake 1 Bright Head Dot -->
  <rect x="6" y="6" width="948" height="288" rx="14"
        fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="20 2452" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" from="0" to="-2472" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Snake 2: Magenta-Orange-Yellow Counter-Clockwise Laser -->
  <rect x="6" y="6" width="948" height="288" rx="14"
        fill="none" stroke="url(#snakeLaser2)" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="260 2212" stroke-dashoffset="-1236"
        opacity="0.9">
    <animate attributeName="stroke-dashoffset" from="-1236" to="1236" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Snake 2 Bright Head Dot -->
  <rect x="6" y="6" width="948" height="288" rx="14"
        fill="none" stroke="#FFE600" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="18 2454" stroke-dashoffset="-1236">
    <animate attributeName="stroke-dashoffset" from="-1236" to="1236" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtle Static Inner Border -->
  <rect x="6" y="6" width="948" height="288" rx="14"
        fill="none" stroke="#7aa2f7" stroke-width="1" stroke-opacity="0.25"/>
</svg>