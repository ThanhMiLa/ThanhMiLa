<svg xmlns="http://www.w3.org/2000/svg" width="150" height="40" viewBox="0 0 150 40" style="isolation: isolate">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&family=Outfit:wght@700;800&display=swap');
      * {
        font-family: 'Outfit', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .btn-text {
        font-family: 'Outfit', sans-serif;
        font-weight: 800;
        font-size: 11px;
        letter-spacing: 1.2px;
      }
    ]]></style>

    <!-- Deep Space Background Gradient -->
    <linearGradient id="btnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111625"/>
      <stop offset="50%" stop-color="#0a0e18"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="btnBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EA4335" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Button Surface -->
  <rect x="1.5" y="1.5" width="147" height="37" rx="18.5" fill="url(#btnBg)" stroke="url(#btnBorder)" stroke-width="1.4"/>

  <!-- Subtle Inner Glow Ring -->
  <rect x="3" y="3" width="144" height="34" rx="17" fill="none" stroke="#EA4335" stroke-width="0.6" stroke-opacity="0.2"/>

  <!-- Brand Icon -->
  <g transform="translate(8, 4)">
    <path d="M22 10.5v11a1.5 1.5 0 0 1-1.5 1.5H18v-7.5l-2 1.5-2-1.5V23H9.5A1.5 1.5 0 0 1 8 21.5v-11l8 6 6-6zm-1.5-2H9.5a1.5 1.5 0 0 0-1 .4L16 14.5l7.5-5.6a1.5 1.5 0 0 0-1-.4z" fill="#EA4335"/>
  </g>

  <!-- Button Text -->
  <text x="48" y="24.5" fill="#f0f6fc" class="btn-text">GMAIL</text>

  <!-- Mini Dot Indicator -->
  <circle cx="135" cy="20" r="2.2" fill="#EA4335"/>
</svg>