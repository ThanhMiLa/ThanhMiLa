<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
  <defs>
    <!-- Background Gradient (Universal High Contrast) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="50%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>

    <!-- Glowing Optical Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BBF7D0"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Leaf Center Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>

    <!-- Subtle Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Modern Rounded Icon Base -->
  <rect width="40" height="40" rx="9" fill="url(#bgGrad)"/>

  <!-- Outer Focus Lens Reticle -->
  <circle cx="20" cy="20" r="13" stroke="url(#ringGrad)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3.5 2.5" opacity="0.9"/>
  <circle cx="20" cy="20" r="10" stroke="#FFFFFF" stroke-width="1.8" opacity="0.95"/>

  <!-- Core Spring Leaf Focus Element -->
  <g filter="url(#glow)">
    <path d="M20 11.5C20 11.5 25.5 15.2 25.5 20C25.5 24.2 21.8 27.5 18 27.5C14.8 27.5 12.5 24.8 12.5 22C12.5 17.2 20 11.5 20 11.5Z" fill="url(#leafGrad)"/>
    <path d="M20 11.5C19 16 16.8 21.2 12.5 22" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Optical Calibration Dots -->
  <circle cx="20" cy="7" r="1.3" fill="#FFFFFF"/>
  <circle cx="33" cy="20" r="1.3" fill="#FFFFFF"/>
  <circle cx="20" cy="33" r="1.3" fill="#FFFFFF"/>
  <circle cx="7" cy="20" r="1.3" fill="#FFFFFF"/>
</svg>
